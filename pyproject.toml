[project]
name = "shifting-hud"
version = "0.1.0"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ryusuke SEKIYAMA", email = "rsky0711@gamil.com" },
]
dependencies = [
    "PySide6>=6.0.0",
    "openant>=1.3.0",
]

[dependency-groups]
dev = [
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203", "E501"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["openant.*"]
ignore_missing_imports = true


